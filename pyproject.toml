[project]
name = "conformal-probability-calibration"
version = "0.1.0"
description = "Adaptive cumulative mass calibration experiments with conformal prediction."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipdb>=0.13.13",
    "matplotlib>=3.10.6",
    "numpy>=2.3.2",
    "pytest>=8.4.1",
    "scikit-learn>=1.7.1",
    "scipy>=1.14.1",
    "jax>=0.4.35",
    "jaxlib>=0.4.35",
    "autograd>=1.7.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "transformers>=4.56.0",
    "venn-abers>=0.2.2",
    "tabulate>=0.9.0",
    "birder"
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that download data or run longer benchmarks",
]
